[package]
name = "horizon-mod-validator"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
horizon-mods = { path = "../horizon-mods", features = ["pack"] }
serde_json = "1"
sha2 = "0.10.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
wasmparser = "0.239"
wasm-encoder = { version = "0.239", features = ["wasmparser"] }

[lints]
workspace = true
