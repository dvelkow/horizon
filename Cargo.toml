[workspace]
exclude = ["launcher", "crates/horizon-telemetry-server"]
members = ["crates/horizon-platform", "crates/horizon-core", "crates/horizon-dualsense", "crates/horizon-world", "crates/voxel-kernels", "crates/horizon-client", "crates/horizon-server-files", "crates/horizon-server", "crates/horizon-bots", "crates/horizon-assets", "crates/horizon-protocol", "crates/horizon-theme", "crates/horizon-shaderpack", "crates/horizon-prepare", "crates/horizon-telemetry", "crates/horizon-bench", "crates/horizon-friends", "crates/horizon-relay", "crates/horizon-mod-sdk", "crates/horizon-mods", "crates/horizon-mods/tests/guest", "crates/cargo-horizon-mod", "crates/horizon-port-pack", "crates/horizon-mod-sdk/examples/coords-hud", "xtask"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

# Ports mirror vanilla's Java signatures, index loops and nested generic types
# one to one so they can be checked against the decompiled sources.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"

# Line tables keep file:line in backtraces; full debug info made every
# example and test binary hundreds of megabytes and slow to link.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

# Optimized but quick-to-link builds for iteration: cargo build --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[patch.crates-io]
# Browser worker startup without eval and with wasm-bindgen 0.2.129 shared memory.
wasm_thread = { path = "vendor/wasm_thread" }

# Browser builds must rebuild std with atomics; web/build.sh owns these flags.
[profile.web]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 32
panic = "abort"
debug = false
strip = "debuginfo"
